name: CI

on:
  push:
    branches: [master, main, "rebuild/**"]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: detekt
        run: ./gradlew detekt

  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: "**/build/reports/tests/"

  verify:
    name: Build and coverage gate
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Coverage gate
        run: ./gradlew koverVerify koverXmlReport
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/
          if-no-files-found: ignore

  publish-dry-run:
    name: Publish dry run
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Throwaway key, local repository: checks signing, sources and javadoc jars and the POM metadata Central requires.
      - name: Sign and publish to a local repository
        run: tools/release/dry-run.sh 0.4.0-rc.1

  testkit-matrix:
    name: TestKit on Gradle 8.14.3
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: TestKit matrix
        run: ./gradlew :mutkt-gradle:matrixTest -Pmutkt.gradleVersions=8.14.3
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-testkit-matrix
          path: mutkt-gradle/build/reports/tests/matrixTest/

  platform-compat:
    name: Forked executor on a second JUnit Platform
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Platform compatibility
        run: ./gradlew :mutkt-junit:platformCompatTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-platform-compat
          path: mutkt-junit/build/reports/tests/platformCompatTest/

  dogfood:
    name: Mutation score of MutKt on itself
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # --continue runs both modules, so the summary shows each score even when one gate fails.
      - name: Mutation testing of mutkt-core and the mutkt-asm operators
        run: ./gradlew -p tools/dogfood mutkt --continue
      - name: Score in the job summary
        if: always()
        run: |
          for module in core asm; do
            report=tools/dogfood/$module/build/reports/mutkt/mutkt.txt
            [ -f "$report" ] || continue
            { echo "### mutkt-$module"; echo '```'; sed -n '1,/^Score/p' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
