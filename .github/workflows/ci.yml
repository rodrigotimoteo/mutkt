name: CI

on:
  push:
    branches: [master, main, "rebuild/**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: detekt
        run: ./gradlew detekt

  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Test
        run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: "**/build/reports/tests/"

  verify:
    name: Build and coverage gate
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build
        run: ./gradlew build
      - name: Coverage gate
        run: ./gradlew koverVerify koverXmlReport
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-report
          path: build/reports/kover/
          if-no-files-found: ignore

  publish-dry-run:
    name: Publish dry run
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # Throwaway key, local repository: checks signing, sources and javadoc jars and the POM metadata Central requires.
      - name: Sign and publish to a local repository
        run: tools/release/dry-run.sh 0.4.0
      - name: Check the published-version probe
        run: tools/release/published-test.sh
      - name: Check the Plugin Portal upload stage
        run: tools/release/publish-plugin-test.sh
      - name: Check the release notes extraction
        run: tools/release/notes-test.sh

  testkit-matrix:
    name: TestKit on Gradle 8.14.3 and 9.9.2
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: TestKit matrix
        run: ./gradlew :mutkt-gradle:matrixTest -Pmutkt.gradleVersions=8.14.3,9.9.2
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-testkit-matrix
          path: mutkt-gradle/build/reports/tests/matrixTest/

  platform-compat:
    name: Forked executor on a second JUnit Platform
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Platform compatibility
        run: ./gradlew :mutkt-junit:platformCompatTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-platform-compat
          path: mutkt-junit/build/reports/tests/platformCompatTest/

  android:
    name: Android (AGP ${{ matrix.agp }} on Gradle ${{ matrix.gradle }}, JDK ${{ matrix.java }})
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Fewer cells resolving AGP at once, so Maven Central does not rate-limit the run (HTTP 429).
      max-parallel: 3
      # The cells of docs/adr/0006-android.md; the runner image ships the Android SDK at ANDROID_HOME.
      matrix:
        include:
          - { agp: 8.4.2, gradle: "8.6", java: 17 }
          - { agp: 8.4.2, gradle: "8.6", java: 21 }
          - { agp: 8.13.2, gradle: 8.14.3, java: 17 }
          - { agp: 9.5.3, gradle: 9.6.0, java: 17 }
          - { agp: 9.5.3, gradle: 9.6.0, java: 21 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # The scenarios resolve AGP and its dependencies into their own Gradle user home, which setup-gradle does not cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutkt-gradle/build/testkit/caches/modules-2
          key: agp-testkit-${{ matrix.agp }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: agp-testkit-${{ matrix.agp }}-
      - name: Android TestKit scenarios
        run: ./gradlew :mutkt-gradle:agpTest -Pmutkt.agp=${{ matrix.agp }} -Pmutkt.agpGradle=${{ matrix.gradle }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-android-agp${{ matrix.agp }}-jdk${{ matrix.java }}
          path: mutkt-gradle/build/reports/tests/agpTest/

  android-sample:
    name: Android sample (AGP ${{ matrix.agp }} on Gradle ${{ matrix.gradle }})
    needs: [lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/rebuild/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The min and latest cells of docs/adr/0006-android.md; the runner image ships the Android SDK at ANDROID_HOME.
      matrix:
        include:
          - { agp: 8.4.2, gradle: "8.6" }
          - { agp: 9.5.3, gradle: 9.6.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: ${{ matrix.gradle }}
      # Robolectric downloads its android-all jar into the Maven local repository on the first test run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      # The repository's own wrapper publishes the plugin: Gradle 9.6 cannot build it from source with Kotlin 2.1.
      - name: Publish the plugin to a local repository
        run: ./gradlew publishAllPublicationsToCentralRepository -Pmutkt.version=0.0.0-sample "-Pmutkt.publishUrl=file://$PWD/build/sample-repo"
      - name: Mutation testing of the sample
        run: gradle -p samples/android mutkt -Pmutkt.agp=${{ matrix.agp }}
      - name: Check the expected counts
        run: |
          report=samples/android/build/reports/mutkt/mutkt.txt
          cat "$report"
          grep -qx 'Mutants: 6' "$report"
          grep -Eqx ' *KILLED +5' "$report"
          grep -Eqx ' *SURVIVED +1' "$report"

  dogfood:
    name: Mutation score of MutKt on itself
    needs: [lint]
    # 13 minutes: not on pull requests. Release verify runs it through workflow_call, where the event is the tag push.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # --continue runs both modules, so the summary shows each score even when one gate fails.
      - name: Mutation testing of mutkt-core and the mutkt-asm operators
        run: ./gradlew -p tools/dogfood mutkt --continue
      - name: Score in the job summary
        if: always()
        run: |
          for module in core asm; do
            report=tools/dogfood/$module/build/reports/mutkt/mutkt.txt
            [ -f "$report" ] || continue
            { echo "### mutkt-$module"; echo '```'; sed -n '1,/^Score/p' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
