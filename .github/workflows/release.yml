name: Release

# Scaffold only. Real publishing is implemented in Linear issue ROD-121 (P4).
# Until then a tag run verifies the build and then FAILS at the publish step on purpose,
# so a stray tag cannot publish anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and publish to the local Maven repo only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Dry run (local publish)
        run: ./gradlew publishToMavenLocal
      - name: Real publish (not configured yet)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          echo "Publishing is not configured yet (ROD-121). Refusing to publish."
          exit 1
