name: Release

# The only workflow that can publish: a v* tag, after the full CI and the approval of the "release" environment.
# Every stage first asks the target repository whether it already has the version, so a re-run after a
# partial failure skips what is done and never replaces a published artifact. See docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Resolve version from the tag
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Fails before anything is published when CHANGELOG.md has no section for the version.
      - name: Release notes from CHANGELOG.md
        run: tools/release/notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          if tools/release/published.sh central "$VERSION"; then
            echo "Central already has $VERSION, skipping the upload"
          else
            ./gradlew publish "-Pmutkt.version=$VERSION"
            tools/release/central-release.sh
          fi
      - name: Wait until Central serves the version
        run: tools/release/published.sh central "$VERSION" 2700
      - name: Gradle Plugin Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if tools/release/published.sh plugin-portal "$VERSION"; then
            echo "The Plugin Portal already has $VERSION, skipping the upload"
          else
            tools/release/publish-plugin.sh "$VERSION" 900 ./gradlew :mutkt-gradle:publishPlugins "-Pmutkt.version=$VERSION"
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            flags=()
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG" "${flags[@]}"
          fi
