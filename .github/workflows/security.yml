name: Security

on:
  push:
    branches: [master, main, "rebuild/**"]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      # Reuses the dependency cache the CI jobs fill, so CodeQL does not hit Maven Central's rate limit.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      # Kotlin is only extracted from a traced compilation: compile in-process, without caches, so
      # every Kotlin source passes through the tracer.
      - name: Compile for CodeQL
        run: ./gradlew assemble --no-build-cache --no-configuration-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --only-verified
