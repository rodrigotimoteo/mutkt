name: Docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: tag to document, e.g. v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # Tags before the guides site (v0.4.0) have no mkdocs.yml: they publish the API reference only.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: hashFiles('mkdocs.yml') != ''
        with:
          python-version: "3.13"
      - name: Build the guides
        if: hashFiles('mkdocs.yml') != ''
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
      # Dokka runs per module: the tags predate a root aggregation. Only these two modules apply mutkt.dokka.
      - name: Generate Dokka HTML
        run: ./gradlew :mutkt-annotations:dokkaGeneratePublicationHtml :mutkt-gradle:dokkaGeneratePublicationHtml
      # After MkDocs, which empties its output directory.
      - name: Add the API reference
        run: |
          mkdir -p site/api
          cp -r mutkt-gradle/build/dokka/html site/api/gradle
          cp -r mutkt-annotations/build/dokka/html site/api/annotations
          [ -f site/index.html ] || echo '<meta http-equiv="refresh" content="0; url=api/">' > site/index.html
          cat > site/api/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>MutKt API docs</title>
          <h1>MutKt API docs</h1>
          <ul>
            <li><a href="gradle/index.html">mutkt-gradle</a></li>
            <li><a href="annotations/index.html">mutkt-annotations</a></li>
          </ul>
          EOF
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
