// Init script of tools/e2e/run.sh: adds the local MutKt repository to a build it does not own and, in
// init-script mode, applies MutKt to the corpus entry's module with the entry's settings.
import groovy.json.JsonSlurper

def repo = System.getProperty('mutkt.e2e.repo')
def entry = new JsonSlurper().parse(new File(System.getProperty('mutkt.e2e.entry')))
def pluginId = 'io.github.rodrigotimoteo.mutkt'
def engineIds = [jupiter: 'junit-jupiter', vintage: 'junit-vintage', robolectric: 'junit-vintage', kotest: 'kotest']

// Patch mode resolves MutKt through the plugins DSL, so the settings need the local repository too.
beforeSettings { settings ->
    def repositories = settings.pluginManagement.repositories
    repositories.maven { url = repo }
    repositories.gradlePluginPortal()
    repositories.google()
    repositories.mavenCentral()
}

// The root buildscript loader is the parent of every project's, so the module can apply the plugin by class. AGP
// classes are visible to MutKt only when the root also declares AGP (usually apply false): see tools/e2e/README.md.
if (entry.apply == 'init-script') {
    rootProject { root ->
        root.buildscript.repositories.maven { url = repo }
        root.buildscript.repositories.google()
        root.buildscript.repositories.mavenCentral()
        root.buildscript.dependencies.add('classpath', 'io.github.rodrigotimoteo:mutkt-gradle:0.0.0-e2e')
    }
}

def configure = { mutkt ->
    def settings = entry.mutkt ?: [:]
    if (settings.targetClasses) mutkt.targetClasses.set(settings.targetClasses)
    if (settings.threads != null) mutkt.threads.set(settings.threads as Integer)
    if (settings.timeoutMs != null) mutkt.timeoutMs.set(settings.timeoutMs as Long)
    if (entry.variant) mutkt.variant.set(entry.variant)
    def engines = (entry.tests ?: []).collect { engineIds[it] }.findAll { it } as Set
    if (engines) mutkt.engines.set(engines)
}

gradle.beforeProject { project ->
    if (project.path != entry.module) return
    project.pluginManager.withPlugin(pluginId) { configure(project.extensions.getByName('mutkt')) }
    if (entry.apply != 'init-script') return
    // After the module's own JVM or Android plugin, so the module's plugins block has set up its class loader.
    ['java', 'com.android.application', 'com.android.library'].each { id ->
        project.pluginManager.withPlugin(id) {
            if (project.pluginManager.hasPlugin(pluginId)) return
            def loader = project.rootProject.buildscript.classLoader
            project.pluginManager.apply(loader.loadClass('com.github.rodrigotimoteo.mutkt.gradle.MutKtPlugin'))
        }
    }
}
