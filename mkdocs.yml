site_name: MutKt
site_description: Mutation testing for Kotlin/JVM and Android
site_url: https://rodrigotimoteo.github.io/mutkt/
repo_url: https://github.com/rodrigotimoteo/mutkt
repo_name: rodrigotimoteo/mutkt
edit_uri: edit/master/docs/
docs_dir: docs
strict: true
validation:
  anchors: warn

# Contributor and release notes stay on GitHub, out of the user site.
exclude_docs: |
  adr/
  rc-evidence/
  agent-brief-template.md
  orchestrator-prompt.md
  rc-checklist.md
  parity.md
  dogfood.md
  third-party.md
  release.md
  requirements.txt

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gradle DSL: dsl.md
  - Operators: operators.md
  - FAQ: faq.md
  - Benchmark: benchmark.md
  - Migration from 0.3.x: migration.md
  - Changelog: changelog.md
  # Dokka output the docs workflow copies in after this build, so strict mode cannot check a relative path.
  - API reference: https://rodrigotimoteo.github.io/mutkt/api/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
